<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3f91">
  <title>한국 잠정실적발표 일정</title>
  <meta name="description" content="한국 잠정실적발표 일정 표">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="sheet" aria-label="한국 잠정실적발표 일정">
    <section class="calendar" id="calendar">
      <div class="month-band" aria-hidden="true"></div>
      <div class="top-bar">
        <h1 id="calendarTitle">한국 잠정실적발표 일정(변동 가능)</h1>
      </div>
      <div class="date-row" id="dateRow"></div>
      <div class="company-row" id="companyRow"></div>
      <div class="split-line split-line-a" aria-hidden="true"></div>
      <div class="split-line split-line-b" aria-hidden="true"></div>
      <p class="load-error" id="loadError" hidden>일정 데이터를 불러오지 못했습니다.</p>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
