name: Static earnings calendar check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - data/calendar.json
      - scripts/update_stockeasy_calendar.py
      - .github/workflows/update.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate calendar JSON
        run: python scripts/update_stockeasy_calendar.py --check
